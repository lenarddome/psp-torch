name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (CPU build of torch)
        run: uv sync --python ${{ matrix.python-version }} --no-group cu128 --group cpu
      - name: Lint
        run: |
          uv run ruff check psp tests benchmarks notebooks/alcove notebooks/execute.py
          uv run ruff format --check psp tests
      - name: Type-check
        run: uv run mypy psp
      - name: Test
        run: uv run pytest
