[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psp-torch"
version = "0.1.0"
description = "Parameter space partitioning MCMC for global model evaluation, in PyTorch"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Lenard Dome", email = "lenarddome@gmail.com" },
]
keywords = ["parameter space partitioning", "cognitive modelling", "model evaluation", "mcmc", "pytorch"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "torch>=2.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
# what the notebooks, benchmarks and `psp.read_saved` need on top of the library
notebooks = ["pandas>=2.0", "matplotlib>=3.7", "jupyter", "ipywidgets>=8", "scikit-learn>=1.3", "nbclient>=0.10"]
# a C++ csv writer that makes `save=True` several times faster; picked up automatically when installed
fast-save = ["pyarrow>=15"]

[dependency-groups]
dev = ["psp-torch[notebooks,fast-save]", "pytest>=7", "ruff>=0.4", "mypy>=1.8"]
# which build of torch uv installs: CUDA 12.8 by default, `uv sync --no-group cu128 --group cpu` for CPU only
cpu = ["torch>=2.0"]
cu128 = ["torch>=2.0"]
docs = [
    "myst-nb>=1.4.0",
    "numpydoc>=1.11.0",
    "pydata-sphinx-theme>=0.19.0",
    "sphinx>=8.1.3",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
]

[project.urls]
Homepage = "https://github.com/lenarddome/psp-torch"
"R package" = "https://lenarddome.com/psp/"

[tool.uv]
default-groups = ["dev", "cu128"]
conflicts = [[{ group = "cpu" }, { group = "cu128" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", group = "cpu" },
  { index = "pytorch-cu128", group = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools.packages.find]
include = ["psp*"]

[tool.setuptools.package-data]
psp = ["py.typed", "data/*.csv", "data/*.csv.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb", "psp-reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N"]
# PSP and PSPLockstep keep the acronym of the method in uppercase
ignore = ["N802", "N803", "N806"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
