<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 900" width="1120" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs><rect width="1120" height="900" fill="#ffffff"/><text x="40" y="28" font-size="11" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="0.7">INPUTS, moved to the device once per call</text>
<rect x="40" y="40" width="330" height="112" rx="6" fill="rgba(42,120,214,0.08)" stroke="#2a78d6" stroke-width="1.2"/>
<text x="56" y="62" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="1.0">Parameter sets on the unit cube</text>
<text x="56" y="82" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="1.0">unit  (B, 4)</text>
<text x="56" y="100" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">to_alcove(): lower + unit · (upper − lower)</text>
<text x="56" y="118" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="1.0">c, φ, λw, λa  each (B,) → (B,1,1)</text>
<text x="56" y="136" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="0.75">so one kernel broadcasts over all B sets</text>
<rect x="395" y="40" width="360" height="112" rx="6" fill="rgba(42,120,214,0.08)" stroke="#2a78d6" stroke-width="1.2"/>
<text x="411" y="62" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="1.0">Training orders (catlearn, seed 7624)</text>
<text x="411" y="82" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="1.0">(N, 12) → sequences() → (S, T, 12)</text>
<text x="411" y="100" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">S = 6 types × 5 learners = 30,  T = 16 blocks × 16 = 256</text>
<text x="411" y="118" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="1.0">x (S,T,3)  t (S,T,2)  present (S,T,3)  ctrl (S,T)</text>
<text x="411" y="136" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="0.75">sliced once; every trial reads column t</text>
<rect x="780" y="40" width="300" height="112" rx="6" fill="rgba(42,120,214,0.08)" stroke="#2a78d6" stroke-width="1.2"/>
<text x="796" y="62" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="1.0">Constants</text>
<text x="796" y="82" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="1.0">h (3, 8)  the 8 stimuli as exemplars</text>
<text x="796" y="100" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="1.0">α0 = ⅓ (3,)   w0 = 0 (2, 8)</text>
<text x="796" y="118" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">expanded to (B,S,3) and (B,S,2,8):</text>
<text x="796" y="136" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="0.75">one network per (parameter set, learner)</text>
<line x1="205" y1="152" x2="205" y2="186" stroke="#1f2933" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="575" y1="152" x2="575" y2="186" stroke="#1f2933" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="930" y1="152" x2="930" y2="186" stroke="#1f2933" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="40" y="190" width="760" height="540" rx="10" fill="rgba(42,120,214,0.05)" stroke="#2a78d6" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="56" y="212" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="1.0">for trial in range(T):   the only sequential part — 256 steps, each a dozen batched kernels</text>
<rect x="56" y="222" width="728" height="30" rx="4" fill="none" stroke="#8a94a6" stroke-width="1"/>
<text x="70" y="241" font-size="11" text-anchor="middle" font-weight="bold" fill="#1f2933" opacity="0.7">1</text>
<text x="88" y="241" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="1.0">reset = ctrl[:,t] == 1 → α ← α0, w ← w0 ;  learn = ctrl[:,t] != 2</text>
<text x="560" y="241" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="0.8">(S,)</text>
<text x="776" y="241" font-size="11" text-anchor="end" font-weight="normal" fill="#1f2933" opacity="0.75">control codes</text>
<rect x="56" y="260" width="728" height="30" rx="4" fill="none" stroke="#8a94a6" stroke-width="1"/>
<text x="70" y="279" font-size="11" text-anchor="middle" font-weight="bold" fill="#1f2933" opacity="0.7">2</text>
<text x="88" y="279" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="1.0">hmx = |h − x_t| · present_t</text>
<text x="560" y="279" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="0.8">(S,3,8)</text>
<text x="776" y="279" font-size="11" text-anchor="end" font-weight="normal" fill="#1f2933" opacity="0.75">shared by the whole batch</text>
<rect x="56" y="298" width="728" height="30" rx="4" fill="none" stroke="#2a78d6" stroke-width="1"/>
<text x="70" y="317" font-size="11" text-anchor="middle" font-weight="bold" fill="#1f2933" opacity="0.7">3</text>
<text x="88" y="317" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="1.0">d = einsum(&quot;bsi,sij→bsj&quot;, α, hmx^r)^(1/r)</text>
<text x="560" y="317" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="0.8">(B,S,8)</text>
<text x="776" y="317" font-size="11" text-anchor="end" font-weight="normal" fill="#1f2933" opacity="0.75">Eq. 1  distance</text>
<rect x="56" y="336" width="728" height="30" rx="4" fill="none" stroke="#2a78d6" stroke-width="1"/>
<text x="70" y="355" font-size="11" text-anchor="middle" font-weight="bold" fill="#1f2933" opacity="0.7">4</text>
<text x="88" y="355" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="1.0">a = exp(−c · d^q)</text>
<text x="560" y="355" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="0.8">(B,S,8)</text>
<text x="776" y="355" font-size="11" text-anchor="end" font-weight="normal" fill="#1f2933" opacity="0.75">Eq. 1  similarity</text>
<rect x="56" y="374" width="728" height="30" rx="4" fill="none" stroke="#2a78d6" stroke-width="1"/>
<text x="70" y="393" font-size="11" text-anchor="middle" font-weight="bold" fill="#1f2933" opacity="0.7">5</text>
<text x="88" y="393" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="1.0">o = einsum(&quot;bskj,bsj→bsk&quot;, w, a)</text>
<text x="560" y="393" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="0.8">(B,S,2)</text>
<text x="776" y="393" font-size="11" text-anchor="end" font-weight="normal" fill="#1f2933" opacity="0.75">Eq. 2  output</text>
<rect x="56" y="412" width="728" height="30" rx="4" fill="none" stroke="#2a78d6" stroke-width="1"/>
<text x="70" y="431" font-size="11" text-anchor="middle" font-weight="bold" fill="#1f2933" opacity="0.7">6</text>
<text x="88" y="431" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="1.0">P = softmax(φ · o) → prob[:,:,t]</text>
<text x="560" y="431" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="0.8">(B,S,2)</text>
<text x="776" y="431" font-size="11" text-anchor="end" font-weight="normal" fill="#1f2933" opacity="0.75">Eq. 3  choice (stable form)</text>
<rect x="56" y="450" width="728" height="30" rx="4" fill="none" stroke="#8a94a6" stroke-width="1"/>
<text x="70" y="469" font-size="11" text-anchor="middle" font-weight="bold" fill="#1f2933" opacity="0.7">7</text>
<text x="88" y="469" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="1.0">t* = max(1, o) where t = 1 ;  min(−1, o) where t = −1</text>
<text x="560" y="469" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="0.8">(B,S,2)</text>
<text x="776" y="469" font-size="11" text-anchor="end" font-weight="normal" fill="#1f2933" opacity="0.75">Eq. 4b  humble teacher</text>
<rect x="56" y="488" width="728" height="30" rx="4" fill="none" stroke="#8a94a6" stroke-width="1"/>
<text x="70" y="507" font-size="11" text-anchor="middle" font-weight="bold" fill="#1f2933" opacity="0.7">8</text>
<text x="88" y="507" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="1.0">e = t* − o</text>
<text x="560" y="507" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="0.8">(B,S,2)</text>
<text x="776" y="507" font-size="11" text-anchor="end" font-weight="normal" fill="#1f2933" opacity="0.75">error</text>
<rect x="56" y="526" width="728" height="30" rx="4" fill="none" stroke="#2a78d6" stroke-width="1"/>
<text x="70" y="545" font-size="11" text-anchor="middle" font-weight="bold" fill="#1f2933" opacity="0.7">9</text>
<text x="88" y="545" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="1.0">Δw = λw · learn · outer(e, a)</text>
<text x="560" y="545" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="0.8">(B,S,2,8)</text>
<text x="776" y="545" font-size="11" text-anchor="end" font-weight="normal" fill="#1f2933" opacity="0.75">Eq. 5  association learning</text>
<rect x="56" y="564" width="728" height="30" rx="4" fill="none" stroke="#2a78d6" stroke-width="1"/>
<text x="70" y="583" font-size="11" text-anchor="middle" font-weight="bold" fill="#1f2933" opacity="0.7">10</text>
<text x="88" y="583" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="1.0">back = einsum(&quot;bsk,bskj→bsj&quot;, e, w) · a</text>
<text x="560" y="583" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="0.8">(B,S,8)</text>
<text x="776" y="583" font-size="11" text-anchor="end" font-weight="normal" fill="#1f2933" opacity="0.75">Eq. 6  back-propagated error</text>
<rect x="56" y="602" width="728" height="30" rx="4" fill="none" stroke="#2a78d6" stroke-width="1"/>
<text x="70" y="621" font-size="11" text-anchor="middle" font-weight="bold" fill="#1f2933" opacity="0.7">11</text>
<text x="88" y="621" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="1.0">Δα = −λa · learn · c · einsum(&quot;bsj,sij→bsi&quot;, back, hmx)</text>
<text x="560" y="621" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="0.8">(B,S,3)</text>
<text x="776" y="621" font-size="11" text-anchor="end" font-weight="normal" fill="#1f2933" opacity="0.75">Eq. 6  attention learning</text>
<rect x="56" y="640" width="728" height="30" rx="4" fill="none" stroke="#8a94a6" stroke-width="1"/>
<text x="70" y="659" font-size="11" text-anchor="middle" font-weight="bold" fill="#1f2933" opacity="0.7">12</text>
<text x="88" y="659" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="1.0">w ← w + Δw ;  α ← clamp(α + Δα, 0)</text>
<text x="560" y="659" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="0.8"></text>
<text x="776" y="659" font-size="11" text-anchor="end" font-weight="normal" fill="#1f2933" opacity="0.75">state update</text>
<path d="M 56 654 C 20 654, 20 312, 54 312" fill="none" stroke="#2a78d6" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="30" y="483.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#2a78d6" opacity="0.9">next trial</text>
<rect x="820" y="190" width="260" height="540" rx="10" fill="none" stroke="#8a94a6" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="836" y="212" font-size="11" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="0.7">STATE on the device</text>
<text x="836" y="240" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="1.0">attention  α (B,S,3)</text>
<text x="836" y="258" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="1.0">weights    w (B,S,2,8)</text>
<text x="836" y="276" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="0.75">read by steps 3 and 5,</text>
<text x="836" y="292" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="0.75">rewritten by step 12</text>
<text x="836" y="330" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="1.0">probabilities  prob (B,S,T,2)</text>
<text x="836" y="348" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="0.75">column t written by step 6</text>
<text x="836" y="390" font-size="11" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="0.7">Memory per parameter set</text>
<text x="836" y="408" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">prob: 30·256·2 doubles = 123 kB</text>
<text x="836" y="426" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">so calls are chunked, B ≤ 256</text>
<text x="836" y="444" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="0.75">(chunk= argument of alcove_curves)</text>
<text x="836" y="486" font-size="11" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="0.7">Batch dims</text>
<text x="836" y="504" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">b: parameter set   s: learner sequence</text>
<text x="836" y="522" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">no kernel loops over b or s;</text>
<text x="836" y="540" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">B·S networks advance together</text>
<text x="836" y="582" font-size="11" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="0.7">What differs from catlearn</text>
<text x="836" y="600" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">softmax(φ·o) is computed in its</text>
<text x="836" y="618" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">stable form; catlearn&#x27;s exp/sum</text>
<text x="836" y="636" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">overflows to NaN where weights</text>
<text x="836" y="654" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">diverge (tiny c, large λw). Else</text>
<text x="836" y="672" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">identical to 1e-15 (tests/data).</text>
<line x1="820" y1="250" x2="804" y2="250" stroke="#8a94a6" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="804" y1="436" x2="820" y2="436" stroke="#8a94a6" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="420" y1="730" x2="420" y2="764" stroke="#1f2933" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="40" y="768" width="1040" height="112" rx="6" fill="rgba(42,120,214,0.08)" stroke="#2a78d6" stroke-width="1.2"/>
<text x="56" y="790" font-size="11" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="0.7">REDUCTION to the model output (alcove_curves)</text>
<text x="56" y="812" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="1.0">correct = where(t1 == 1, prob[...,0], prob[...,1])   (B,S,T)        error = 1 − correct</text>
<text x="56" y="834" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="1.0">cell = type(s) · 16 + block(t)  →  sums.index_add_(1, cell, error)  →  ÷ counts        (B, 96)</text>
<text x="56" y="856" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="0.8">96 numbers per parameter set: the mean error of each type in each of 16 blocks, over 5 learners and 16 trials — what discretize() turns into a weak order</text></svg>