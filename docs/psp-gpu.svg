<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 980" width="1120" height="980" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs><rect width="1120" height="980" fill="#ffffff"/><rect x="40" y="70" width="440" height="880" rx="10" fill="rgba(138,148,166,0.10)" stroke="#8a94a6" stroke-width="1.2"/>
<text x="56" y="92" font-size="11" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="0.75">CPU  (Python objects, NumPy, files)</text>
<rect x="520" y="70" width="560" height="880" rx="10" fill="rgba(42,120,214,0.08)" stroke="#2a78d6" stroke-width="1.2"/>
<text x="536" y="92" font-size="11" text-anchor="start" font-weight="bold" fill="#2a78d6" opacity="1.0">DEVICE  (torch tensors: cuda or cpu, one dtype)</text>
<text x="40" y="40" font-size="12.5" text-anchor="start" font-weight="bold" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="1.0">pspGlobal(model, discretize, control, save, …, device, dtype, generator)</text>
<rect x="56" y="110" width="408" height="70" rx="6" fill="none" stroke="#1f2933" stroke-width="1.2"/>
<text x="72" y="132" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="1.0">Control.from_mapping</text>
<text x="72" y="150" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">validates keys, bounds, names, stopping rule;</text>
<text x="72" y="166" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">population / iterations: 0 or None = unbounded</text>
<rect x="536" y="110" width="528" height="70" rx="6" fill="none" stroke="#2a78d6" stroke-width="1.2"/>
<text x="552" y="132" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="1.0">settings as device tensors</text>
<text x="552" y="150" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="1.0">init (n0,d)   lower, upper (d)   radius (d)</text>
<text x="552" y="166" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">dtype of init (float64 by default); rowwise() wraps per-row callbacks</text>
<line x1="464" y1="145" x2="534" y2="145" stroke="#1f2933" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="56" y="196" width="408" height="56" rx="6" fill="none" stroke="#1f2933" stroke-width="1.2"/>
<text x="72" y="218" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="1.0">PatternStore</text>
<text x="72" y="236" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="1.0">dict bytes→id   patterns: list of (D,D) float64   counts (P,) int64</text>
<rect x="536" y="196" width="528" height="56" rx="6" fill="none" stroke="#2a78d6" stroke-width="1.2"/>
<text x="552" y="218" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="1.0">centres (P, d)</text>
<text x="552" y="236" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">the last parameter set that produced each pattern; grows with P</text>
<text x="40" y="280" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="0.8">iteration 0: evaluate every row of init, register the patterns, write them if save=True — then:</text>
<rect x="48" y="296" width="1024" height="560" rx="10" fill="none" stroke="#1f2933" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="64" y="316" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="1.0">while patterns are still filling and iteration &lt; cap:</text>
<rect x="56" y="330" width="408" height="60" rx="6" fill="none" stroke="#1f2933" stroke-width="1.2"/>
<text x="70" y="349" font-size="11" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="0.6">1</text>
<text x="90" y="349" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="1.0">which patterns need more points</text>
<text x="90" y="367" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">ids = nonzero(counts &lt; population)   (k,)</text>
<text x="90" y="383" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">k = batch size of this iteration</text>
<line x1="464" y1="360" x2="534" y2="360" stroke="#1f2933" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="536" y="330" width="528" height="60" rx="6" fill="none" stroke="#2a78d6" stroke-width="1.2"/>
<text x="550" y="349" font-size="11" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="0.6">2</text>
<text x="570" y="349" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="1.0">gather centres and propose</text>
<text x="570" y="367" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">centres[ids]  (k,d)   +  hyper_points(k):  randn (k,d) / ‖row‖ · (rand(d) · radius)</text>
<rect x="536" y="404" width="528" height="46" rx="6" fill="none" stroke="#2a78d6" stroke-width="1.2"/>
<text x="550" y="423" font-size="11" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="0.6">3</text>
<text x="570" y="423" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="1.0">clamp onto the bounds</text>
<text x="570" y="441" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">jumping = max(min(centres + steps, upper), lower)   (k,d)</text>
<rect x="536" y="464" width="528" height="46" rx="6" fill="none" stroke="#2a78d6" stroke-width="1.2"/>
<text x="550" y="483" font-size="11" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="0.6">4</text>
<text x="570" y="483" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="1.0">model(jumping)  — the user&#x27;s batched model, one call</text>
<text x="570" y="501" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">continuous  (k, responses)</text>
<rect x="536" y="524" width="528" height="46" rx="6" fill="none" stroke="#2a78d6" stroke-width="1.2"/>
<text x="550" y="543" font-size="11" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="0.6">5</text>
<text x="570" y="543" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="1.0">discretize(continuous)  — one call</text>
<text x="570" y="561" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">ordinal  (k, D, D)</text>
<path d="M 536 547 L 464 547 L 464 600" fill="none" stroke="#2a78d6" stroke-width="1.3" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
<text x="458" y="566" font-size="10.5" text-anchor="end" font-weight="normal" fill="#2a78d6" opacity="1.0">ordinal to CPU as float64:</text>
<text x="458" y="580" font-size="10.5" text-anchor="end" font-weight="normal" fill="#2a78d6" opacity="1.0">k·D·D doubles, the one sync</text>
<rect x="56" y="604" width="408" height="92" rx="6" fill="none" stroke="#1f2933" stroke-width="1.2"/>
<text x="70" y="623" font-size="11" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="0.6">6</text>
<text x="90" y="623" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="1.0">PatternStore.update — pattern identity</text>
<text x="90" y="641" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">canonicalise: −0.0 → 0.0, every NaN → one NaN</text>
<text x="90" y="657" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="1.0">key = row.tobytes()  → dict lookup, Python loop over k rows</text>
<text x="90" y="673" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">new pattern: append matrix, counts += 0, centre slot grows</text>
<text x="90" y="689" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">counts += bincount(ids);  returns ids (k,) int64</text>
<path d="M 464 650 L 536 650" fill="none" stroke="#2a78d6" stroke-width="1.3" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
<text x="500" y="643" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#2a78d6" opacity="1.0">ids to device</text>
<rect x="536" y="604" width="528" height="62" rx="6" fill="none" stroke="#2a78d6" stroke-width="1.2"/>
<text x="550" y="623" font-size="11" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="0.6">7</text>
<text x="570" y="623" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="1.0">move the centres</text>
<text x="570" y="641" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">last[id] = max row index with that id   (scatter_reduce amax)</text>
<text x="570" y="657" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">centres[touched] = jumping[last[touched]]   — deterministic, no race</text>
<rect x="56" y="712" width="408" height="76" rx="6" fill="none" stroke="#1f2933" stroke-width="1.2"/>
<text x="70" y="731" font-size="11" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="0.6">8</text>
<text x="90" y="731" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="1.0">RunWriter.write  (only if save=True)</text>
<text x="90" y="749" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">jumping, continuous → CPU float64; rows buffered</text>
<text x="90" y="765" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">flushed every 4096 rows: pyarrow csv (C++) if installed,</text>
<text x="90" y="781" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">else repr() — both shortest round-trip text</text>
<rect x="56" y="804" width="408" height="40" rx="6" fill="none" stroke="#1f2933" stroke-width="1.2"/>
<text x="70" y="823" font-size="11" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="0.6">9</text>
<text x="90" y="823" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="1.0">stop?</text>
<text x="90" y="841" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">no pattern below population  or  iteration == cap</text>
<path d="M 56 824 C 20 824, 20 360, 54 360" fill="none" stroke="#1f2933" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="28" y="592" font-size="10" text-anchor="middle" font-weight="normal" fill="#1f2933" opacity="0.8">next</text>
<text x="28" y="604" font-size="10" text-anchor="middle" font-weight="normal" fill="#1f2933" opacity="0.8">iteration</text>
<line x1="260" y1="856" x2="260" y2="884" stroke="#1f2933" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="56" y="888" width="408" height="50" rx="6" fill="none" stroke="#1f2933" stroke-width="1.2"/>
<text x="72" y="908" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2933" opacity="1.0">PSPResult</text>
<text x="72" y="926" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Consolas, 'DejaVu Sans Mono', monospace" opacity="1.0">ordinal_patterns (P,D,D) float64 CPU · ordinal_counts (P,) · iterations</text>
<rect x="536" y="690" width="528" height="150" rx="8" fill="none" stroke="#2a78d6" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="552" y="712" font-size="11" text-anchor="start" font-weight="bold" fill="#2a78d6" opacity="1.0">Where the work is</text>
<text x="552" y="732" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">Steps 2–5 and 7 are about ten kernel launches per iteration whatever k is:</text>
<text x="552" y="748" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">a fixed cost of a few hundred µs. Step 4 is the only cost that scales with k</text>
<text x="552" y="764" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">and with the model. So the device pays off when model(jumping) does real</text>
<text x="552" y="780" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="1.0">tensor work for many rows at once; k is the number of patterns still filling.</text>
<text x="552" y="806" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="0.8">The R package runs the same loop with k calls of model per iteration,</text>
<text x="552" y="822" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="0.8">one parameter set each; here there is one call, and k rows go through it.</text>
<text x="552" y="870" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="0.8">Same sampler as R: one proposal per underpopulated pattern per iteration,</text>
<text x="552" y="886" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="0.8">direction uniform on the sphere, per-dimension scale uniform in (0, radius)</text>
<text x="552" y="902" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="0.8">and shared by the batch, clamped to the bounds, centred on the last point</text>
<text x="552" y="918" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933" opacity="0.8">that produced the pattern. Only the random numbers differ.</text></svg>